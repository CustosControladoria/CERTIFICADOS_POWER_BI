<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado de Conclusão - Contábil Sheets</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        /* Formulário de Entrada */
        .form-container {
            background: #ffffff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .form-container input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
        }

        .form-container button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .form-container button:hover {
            background-color: #1b5e20;
        }

        /* Moldura do Certificado (A4 Deitado) */
        .certificado {
            width: 297mm;
            height: 210mm;
            background: #ffffff;
            border: 10px solid #2e7d32;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 34px;
            color: #1a1a1a;
            margin: 5px 0 0 0;
            letter-spacing: 2px;
        }

        .header h2 {
            font-size: 20px;
            color: #2e7d32;
            margin-top: 2px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .content {
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            margin: 10px 0;
        }

        .nome-aluno {
            font-size: 30px;
            font-weight: bold;
            color: #000;
            border-bottom: 2px solid #2e7d32;
            display: inline-block;
            min-width: 450px;
            padding-bottom: 5px;
            margin: 15px 0;
        }

        .curso {
            font-size: 22px;
            font-weight: bold;
            color: #2e7d32;
            display: block;
            margin: 8px 0;
        }

        /* Assinaturas */
        .assinaturas {
            display: flex;
            justify-content: space-between;
            padding: 0 50px;
            margin-top: 20px;
        }

        .assinatura-box {
            text-align: center;
            width: 250px;
        }

        .linha {
            border-top: 1px solid #000;
            margin-bottom: 8px;
        }

        /* Configuração de Impressão */
        @media print {
            body {
                background: none;
                padding: 0;
            }

            .form-container {
                display: none;
            }

            .certificado {
                box-shadow: none;
                page-break-after: always;
            }

            @page {
                size: A4 landscape;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Formulário do Aluno -->
    <div class="form-container">
        <h2>Emissão de Certificado</h2>
        <input type="text" id="nomeInput" placeholder="Digite o nome completo do aluno">
        <button onclick="gerarEImprimir()">Gerar e Imprimir</button>
    </div>

    <!-- Layout do Certificado -->
    <div class="certificado">
        <div class="header">
            <!-- URL direta para a imagem hospedada no Google Drive -->
            <img src="https://lh3.googleusercontent.com/d/1qmrFK7pTX37YS69QO0tnNolYneENSubQ" alt="Contábil Sheets Logo" class="logo">
            <h1>CERTIFICADO</h1>
            <h2>DE CONCLUSÃO</h2>
        </div>

        <div class="content">
            <p>Certificamos que o aluno:</p>
            <div class="nome-aluno" id="nomeExibido">[Nome do Aluno]</div>
            <p>
                concluiu com êxito o curso livre de:<br>
                <span class="curso">POWER BI - DO ZERO AO DASHBOARD PROFISSIONAL</span>
                com 100% de aproveitamento na data de 22/08/2026 a 26/08/2026<br>
                com carga horária de 20 horas.
            </p>
        </div>

        <div class="assinaturas">
            <div class="assinatura-box">
                <div class="linha"></div>
                <p>CONTÁBIL SHEETS</p>
            </div>
            <div class="assinatura-box">
                <div class="linha"></div>
                <p id="assinaturaAluno">Aluno</p>
            </div>
        </div>
    </div>

    <script>
        function gerarEImprimir() {
            const nome = document.getElementById('nomeInput').value.trim();
            
            if (nome === "") {
                alert("Por favor, digite o nome completo do aluno.");
                return;
            }

            // Atualiza os campos no certificado
            document.getElementById('nomeExibido').innerText = nome;
            document.getElementById('assinaturaAluno').innerText = nome;

            // Abre a janela de impressão
            window.print();
        }
    </script>
</body>
</html>
