<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>BI_CUSTOS_ORCAMENTO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
padding:25px 15px;
background:
linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.75)),
url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?q=80&w=1400&auto=format&fit=crop');
background-size:cover;
background-position:center;
background-attachment:fixed;
color:#fff;
overflow-x:hidden;
}

.container{
width:100%;
max-width:420px;
text-align:center;
animation:fade 1.2s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.profile{
margin-top:10px;
margin-bottom:25px;
}

.profile img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:4px solid rgba(255,255,255,0.2);
box-shadow:0 0 25px rgba(0,0,0,0.5);
}

.profile h1{
margin-top:18px;
font-size:34px;
font-weight:700;
letter-spacing:1px;
}

.profile p{
margin-top:8px;
font-size:14px;
color:#d0d0d0;
}

.card{
width:100%;
background:rgba(0,0,0,0.88);
border-radius:22px;
padding:14px;
margin-bottom:22px;
display:flex;
align-items:center;
justify-content:space-between;
text-decoration:none;
color:#fff;
transition:0.35s;
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(8px);
box-shadow:0 8px 25px rgba(0,0,0,0.45);
position:relative;
overflow:hidden;
}

.card:hover{
transform:translateY(-4px) scale(1.02);
box-shadow:0 12px 30px rgba(0,0,0,0.6);
}

.card::before{
content:'';
position:absolute;
top:0;
left:-80%;
width:40%;
height:100%;
background:linear-gradient(
120deg,
transparent,
rgba(255,255,255,0.18),
transparent
);
transform:skewX(-20deg);
transition:0.7s;
}

.card:hover::before{
left:140%;
}

.thumb{
width:70px;
height:70px;
border-radius:14px;
object-fit:cover;
flex-shrink:0;
}

.card-title{
flex:1;
text-align:center;
font-size:24px;
font-weight:700;
padding:0 12px;
}

.menu{
font-size:28px;
opacity:0.6;
padding-right:5px;
}

.footer{
margin-top:25px;
font-size:12px;
color:#cfcfcf;
opacity:0.8;
}

@media(max-width:480px){

.profile h1{
font-size:28px;
}

.card-title{
font-size:19px;
}

.card{
padding:12px;
}

.thumb{
width:62px;
height:62px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="profile">

<img src="https://cdn-icons-png.flaticon.com/512/869/869869.png">

<h1>BI_CUSTOS_ORCAMENTO</h1>

<p>PAINÉIS POWER BI • CONTROLADORIA AGRÍCOLA</p>

</div>

<!-- PAINEL LOCAÇÃO -->
<a href="#" class="card" onclick="abrirLocacao(event)">

<img 
class="thumb"
src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=400&auto=format&fit=crop"
>

<div class="card-title">
PAINEL LOCAÇÃO
</div>

<div class="menu">
⋮
</div>

</a>

<!-- PAINEL QL SALARIO -->
<a href="#" class="card" onclick="abrirQL(event)">

<img 
class="thumb"
src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=400&auto=format&fit=crop"
>

<div class="card-title">
PAINEL QL SALARIO
</div>

<div class="menu">
⋮
</div>

</a>

<div class="footer">
© 2026 • BI_CUSTOS_ORCAMENTO
</div>

</div>

</script>

</body>
</html>
